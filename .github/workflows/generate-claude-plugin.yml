name: Generate Claude plugin manifest

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: claude-plugin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}

      - name: Generate plugin manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = {
              "name": "setup-skills",
              "description": "Personal AI agent skills for expenses and YouTube transcripts.",
              "skills": "./Skills",
          }
          path = Path(".claude-plugin/plugin.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Commit updated manifest
        run: |
          git add -- .claude-plugin/plugin.json
          if git diff --cached --quiet; then
            echo "Claude plugin manifest is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate Claude plugin manifest"
          git push origin "HEAD:$GITHUB_REF_NAME"
